<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xyurei Offc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: landing penuh lebar dengan mock dock 3 kolom; dashboard & tutorial memakai sidebar kiri + konten kanan. */
:root {
  --bg: #01030a;
  --surface: #050b1d;
  --surface2: #0c1838;
  --line: rgba(110, 160, 255, 0.17);
  --fg: #e8eefc;
  --muted: #93a3cb;
  --accent: #2e78ff;
  --accent-ink: #ffffff;
  --cyan: #00d0ff;
  --c-import: #00d0ff;
  --c-upload: #86a8ff;
  --c-tools: #2fe0c0;
  --ok: #46f4b0;
  --warn: #ffd846;
  --danger: #ff7a7a;
  --code-bg: #00020a;
  --font-display: "Chakra Petch", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
/* Default selalu gelap (hitam). Tema terang hanya aktif kalau dipilih lewat tombol Tema. */
:root[data-theme="light"] {
  --bg: #f2f5fc; --surface: #ffffff; --surface2: #e6edfb; --line: rgba(20, 40, 100, 0.14);
  --fg: #0b1530; --muted: #52618a; --accent: #1d5fe0; --accent-ink: #ffffff; --cyan: #0079a6;
  --c-import: #0083b0; --c-upload: #3b62d6; --c-tools: #0b8f79;
  --ok: #0a7f55; --warn: #8a6500; --danger: #c13434; --code-bg: #eaf0fc;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
}
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; letter-spacing: 0.005em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono { font-family: var(--font-mono); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 16px; height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.brand i {
  width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: 14px;
  background: var(--accent); color: var(--accent-ink);
}
.top nav { display: flex; gap: 4px; margin-left: auto; align-items: center; }
.top nav a, .theme {
  text-decoration: none; padding: 7px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 14px;
  background: none; border: 0;
}
.top nav a:hover, .theme:hover { color: var(--fg); background: var(--surface); }
.top nav a[aria-current="page"] { color: var(--fg); background: var(--surface); }
.theme { border: 1px solid var(--line); }

/* ---------- tombol ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 14px;
  padding: 11px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); }

/* ---------- landing ---------- */
.hero { padding-block: 56px 40px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; background: var(--surface);
}
.pill b { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.hero h1 { font-size: clamp(34px, 5.4vw, 60px); font-weight: 700; margin-top: 18px; }
.hero h1 em { font-style: normal; color: var(--cyan); }
.hero p.lead { margin-top: 16px; color: var(--muted); font-size: 16px; max-width: 46ch; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.hero .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 28px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.dock {
  display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.25fr) minmax(0, 0.8fr); gap: 10px; align-items: stretch;
  padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);
}
.win { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.win .bar { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.win .bar i { width: 6px; height: 6px; border-radius: 50%; background: var(--c-tools); }
.win.mid .bar i { background: var(--cyan); }
.disc {
  width: 70%; aspect-ratio: 1; margin: 6px auto; border-radius: 50%;
  background: radial-gradient(circle, var(--bg) 0 8%, var(--surface2) 9% 30%, var(--bg) 31% 34%, var(--surface2) 35% 62%, var(--bg) 63% 66%, var(--surface2) 67%);
  border: 2px solid var(--c-upload); animation: spin 14s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ph { height: 8px; border-radius: 4px; background: var(--surface2); }
.ph.s { width: 60%; } .ph.m { width: 80%; }
.minis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.mini { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
.mini small { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--muted); }
.mini b { font-family: var(--font-display); font-size: 18px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chips span { font-family: var(--font-mono); font-size: 9px; padding: 2px 6px; border-radius: 5px; background: var(--surface2); color: var(--muted); }
.chips span.on { background: var(--accent); color: var(--accent-ink); }
.row { display: flex; align-items: center; gap: 6px; padding: 5px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.row i { width: 18px; height: 18px; border-radius: 4px; background: var(--surface2); flex: none; }
.row .ph { flex: 1; }

.section { padding-block: 48px; border-top: 1px solid var(--line); }
.section h2 { font-size: clamp(24px, 3.2vw, 34px); }
.section .sub { color: var(--muted); margin-top: 8px; max-width: 60ch; }
.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 28px; }
.group h3 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.group h3::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--g); }
.group ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.group li a { display: block; text-decoration: none; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.group li a:hover b { color: var(--cyan); }
.group li b { font-family: var(--font-display); font-size: 16px; display: block; }
.group li span { color: var(--muted); font-size: 13px; }
.g-import { --g: var(--c-import); } .g-upload { --g: var(--c-upload); } .g-tools { --g: var(--c-tools); }

.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 28px; counter-reset: q; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.quick li { list-style: none; padding: 18px; border-right: 1px solid var(--line); background: var(--surface); counter-increment: q; }
.quick li:last-child { border-right: 0; }
.quick li::before { content: counter(q); font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--cyan); display: block; margin-bottom: 6px; }
.quick b { display: block; font-family: var(--font-display); font-size: 16px; margin-bottom: 4px; }
.quick span { color: var(--muted); font-size: 13px; }
.quick { padding: 0; margin-inline: 0; }
footer.foot { border-top: 1px solid var(--line); padding-block: 28px; color: var(--muted); font-size: 13px; }
footer.foot .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

/* ---------- app shell (dashboard + tutorial) ---------- */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; padding-block: 28px 64px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; max-height: calc(100vh - 100px); overflow-y: auto; }
.side h4 { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
.side h4:first-child { margin-top: 0; }
.side a { display: flex; align-items: center; gap: 9px; text-decoration: none; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 500; }
.side a:hover { background: var(--surface); color: var(--fg); }
.side a[aria-current="page"] { background: var(--surface2); color: var(--fg); }
.side a i { font-style: normal; font-family: var(--font-mono); font-size: 10px; width: 24px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--surface); color: var(--g, var(--muted)); border: 1px solid var(--line); flex: none; }
.main { min-width: 0; }

.page-title { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.page-title h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 700; }
.page-title p { color: var(--muted); margin-top: 6px; max-width: 58ch; }
.search { position: relative; }
.search input {
  width: 260px; max-width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); font: inherit; font-size: 14px;
}
.search input::placeholder { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
.stat small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.stat b { display: block; font-family: var(--font-display); font-size: 32px; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 28px; }
.filters button { border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 500; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.card {
  display: flex; flex-direction: column; gap: 10px; text-decoration: none; padding: 16px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); min-width: 0; transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--g); transform: translateY(-2px); }
.card .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 13px; color: var(--g); border: 1px solid var(--g); background: var(--bg); }
.card b { font-family: var(--font-display); font-size: 17px; }
.card p { color: var(--muted); font-size: 13px; line-height: 1.5; }
.card .go { margin-top: auto; font-size: 12px; font-family: var(--font-mono); color: var(--g); }
.empty { color: var(--muted); padding: 24px 0; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--surface); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td code, p code, li code, .kbd {
  font-family: var(--font-mono); font-size: 12.5px; background: var(--surface2); padding: 1px 6px; border-radius: 5px; white-space: nowrap;
}
.btnchip { font-family: var(--font-mono); font-weight: 600; font-size: 12px; background: var(--accent); color: var(--accent-ink); padding: 3px 9px; border-radius: 6px; white-space: nowrap; display: inline-block; }

/* ---------- halaman tutorial ---------- */
.crumbs { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.crumbs a { text-decoration: none; } .crumbs a:hover { color: var(--cyan); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.meta span { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted); }
.meta span b { color: var(--g); font-weight: 600; }
.block { margin-top: 36px; }
.block > h2 { font-size: 22px; margin-bottom: 14px; }
.need { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.need li { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; gap: 10px; }
.need li::before { content: "✓"; color: var(--ok); font-weight: 700; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 0; border-left: 2px solid var(--line); margin-left: 15px; }
.steps li { counter-increment: s; position: relative; padding: 0 0 22px 28px; }
.steps li:last-child { padding-bottom: 0; }
.steps li::before {
  content: counter(s); position: absolute; left: -17px; top: -2px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; background: var(--bg); border: 2px solid var(--g, var(--cyan)); color: var(--fg);
}
.steps b { font-family: var(--font-display); font-size: 17px; display: block; }
.steps p { color: var(--muted); margin-top: 2px; max-width: 68ch; }
.notes { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 72ch; }
.notes li::marker { color: var(--g, var(--cyan)); }
.code { position: relative; margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--code-bg); }
.code .cap { display: flex; justify-content: space-between; align-items: center; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.code .cap button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 10px; font-size: 12px; }
.code pre { margin: 0; padding: 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details + details { margin-top: 8px; }
summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: baseline; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; font-family: var(--font-mono); color: var(--warn); width: 12px; }
details[open] summary::before { content: "–"; }
details p { padding: 0 14px 14px 36px; color: var(--muted); max-width: 70ch; }
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 48px; }
.pager a { text-decoration: none; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); min-width: 0; }
.pager a:hover { border-color: var(--cyan); }
.pager small { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.pager b { font-family: var(--font-display); font-size: 16px; }
.pager a:last-child { text-align: right; }
.callout { margin-top: 14px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--surface); max-width: 72ch; }

/* ---------- efek futuristik ---------- */
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; }
.hero { position: relative; overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0; opacity: 0.75; pointer-events: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse 75% 85% at 50% 35%, #000 15%, transparent 78%);
  mask-image: radial-gradient(ellipse 75% 85% at 50% 35%, #000 15%, transparent 78%);
  animation: gridmove 14s linear infinite;
}
.hero::after {
  content: ""; position: absolute; width: 540px; height: 540px; right: -140px; top: -170px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 42%, transparent), transparent 65%);
  filter: blur(8px); animation: orb 9s ease-in-out infinite alternate;
}
.hero .wrap { position: relative; z-index: 1; }
@keyframes gridmove { to { background-position: 0 44px, 44px 0; } }
@keyframes orb { to { transform: translate(-70px, 60px) scale(1.18); } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes shine { to { background-position: 200% 0; } }
@keyframes blink { 50% { opacity: 0.25; } }
@keyframes sweep { from { top: 0; } to { top: 100%; } }
@keyframes glowpulse { 50% { box-shadow: 0 0 46px -6px color-mix(in srgb, var(--cyan) 50%, transparent); } }
@keyframes marquee { to { transform: translateX(-50%); } }

.rise { animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 55ms); }
.hero .wrap > div:first-child > * { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.hero .wrap > div:first-child > :nth-child(2) { animation-delay: 0.08s; }
.hero .wrap > div:first-child > :nth-child(3) { animation-delay: 0.16s; }
.hero .wrap > div:first-child > :nth-child(4) { animation-delay: 0.24s; }
.hero .wrap > div:first-child > :nth-child(5) { animation-delay: 0.32s; }
.stats .stat { animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.stats .stat:nth-child(2) { animation-delay: 0.07s; } .stats .stat:nth-child(3) { animation-delay: 0.14s; } .stats .stat:nth-child(4) { animation-delay: 0.21s; }
.group li { animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.group li:nth-child(2) { animation-delay: 0.07s; } .group li:nth-child(3) { animation-delay: 0.14s; } .group li:nth-child(4) { animation-delay: 0.21s; }

.pill b { animation: blink 1.4s ease-in-out infinite; box-shadow: 0 0 10px var(--ok); }
.hero h1 em {
  background: linear-gradient(90deg, var(--cyan), #7aa8ff, var(--cyan)); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  animation: shine 4.5s linear infinite;
}
.btn.primary { box-shadow: 0 0 24px -6px var(--accent); }
.btn.primary:hover { box-shadow: 0 0 34px -2px var(--accent); }
.dock { position: relative; overflow: hidden; box-shadow: 0 0 26px -10px var(--cyan); animation: rise 0.9s 0.2s both, glowpulse 4.5s 1.2s ease-in-out infinite; }
.dock::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; pointer-events: none; opacity: 0.7;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent); animation: sweep 5.5s linear infinite;
}
.card:hover { box-shadow: 0 0 28px -8px var(--g); }
.stat b { text-shadow: 0 0 20px color-mix(in srgb, var(--cyan) 35%, transparent); }

.chart-box canvas.chart { width: 100%; height: 100px; display: block; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.chead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-bottom: 6px; }
.chead b { color: var(--fg); font-size: 11px; }
.chead .px { color: var(--fg); font-size: 13px; font-variant-numeric: tabular-nums; }
.chead .chg { font-variant-numeric: tabular-nums; }
.chead em { font-style: normal; margin-left: auto; opacity: 0.8; }
.up { color: var(--ok); } .down { color: var(--danger); }
.panel { margin-top: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px; }
.panel .chead { font-size: 12px; margin-bottom: 10px; }
.panel .chead b { font-size: 13px; }
.panel .chead .px { font-size: 22px; font-family: var(--font-display); font-weight: 600; }
.panel canvas.chart { height: 200px; }

.ticker { border-block: 1px solid var(--line); overflow: hidden; background: var(--surface); }
.ticker .track { display: flex; width: max-content; animation: marquee 60s linear infinite; }
.ticker .track:hover { animation-play-state: paused; }
.ticker span { white-space: nowrap; padding: 10px 22px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); }
.ticker b { color: var(--fg); font-weight: 600; margin-right: 10px; }
.ticker em { font-style: normal; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- responsive ---------- */
@media (max-width: 940px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); }
  .groups { grid-template-columns: minmax(0, 1fr); }
  .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quick li:nth-child(2) { border-right: 0; }
  .quick li:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .side { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .side h4 { display: none; }
  .side a { white-space: nowrap; border: 1px solid var(--line); }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .cards { grid-template-columns: minmax(0, 1fr); }
  .dock { grid-template-columns: minmax(0, 1fr); }
  .dock .win:not(.mid) { display: none; }
  .quick { grid-template-columns: minmax(0, 1fr); }
  .quick li { border-right: 0; border-bottom: 1px solid var(--line); }
  .quick li:last-child { border-bottom: 0; }
  .top nav a:not([data-keep]) { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a:last-child { text-align: left; }
  .search input { width: 100%; }
  .search { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .disc { animation: none; }
  html { scroll-behavior: auto; }
  .card { transition: none; }
}
</style>

  function makeChart(canvas, kind) {
    var ctx = canvas.getContext("2d");
    var box = canvas.parentNode;
    var pxEl = box.querySelector(".px"), chgEl = box.querySelector(".chg");
    var N = kind === "candle" ? 46 : 72;
    var stepMs = kind === "candle" ? 950 : 620;
    var price = 1.25, trend = 0.003, candles = [];
    function tick() {
      if (Math.random() < 0.14) trend = (Math.random() - 0.5) * 0.014;
      var o = price, hi = price, lo = price;
      for (var i = 0; i < 4; i++) {
        price += trend * 0.5 + (Math.random() - 0.5) * 0.02 + (1.25 - price) * 0.012;
        if (price > hi) hi = price;
        if (price < lo) lo = price;
      }
      return { o: o, c: price, h: hi + Math.random() * 0.004, l: lo - Math.random() * 0.004 };
    }
    for (var k = 0; k < N; k++) candles.push(tick());
    var base = candles[0].c;
    function head() {
      var p = candles[candles.length - 1].c, pct = (p - base) / base * 100;
      if (pxEl) pxEl.textContent = p.toFixed(4);
      if (chgEl) { chgEl.className = "chg " + (pct >= 0 ? "up" : "down"); chgEl.textContent = (pct >= 0 ? "▲ " : "▼ ") + Math.abs(pct).toFixed(2) + "%"; }
    }
    head();
    var col = palette(), frame = 0, t = 0, last = performance.now(), scroll = 0, sMin = null, sMax = null;

    function draw(now) {
      var dpr = Math.min(window.devicePixelRatio || 1, 2), w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      var cw = Math.round(w * dpr), ch = Math.round(h * dpr);
      if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      var padT = 14, padB = 14, dx = w / (N - 4);

      var mn = Infinity, mx = -Infinity;
      for (var i = 0; i < N; i++) { if (candles[i].l < mn) mn = candles[i].l; if (candles[i].h > mx) mx = candles[i].h; }
      if (sMin === null) { sMin = mn; sMax = mx; }
      sMin += (mn - sMin) * 0.08; sMax += (mx - sMax) * 0.08;
      var span = Math.max(sMax - sMin, 0.0001);
      function Y(v) { return padT + (1 - (v - sMin) / span) * (h - padT - padB); }
      function X(i) { return w + (i - (N - 1)) * dx + (1 - t) * dx; }

      /* grid */
      ctx.lineWidth = 1; ctx.strokeStyle = col.grid; ctx.globalAlpha = 0.9;
      ctx.beginPath();
      for (var g = 1; g < 4; g++) { var gy = Math.round(h * g / 4) + 0.5; ctx.moveTo(0, gy); ctx.lineTo(w, gy); }
      var sp = dx * 6;
      for (var v = 0; v < w / sp + 2; v++) { var gx = Math.round(w - (scroll % sp) - v * sp) + 0.5; ctx.moveTo(gx, 0); ctx.lineTo(gx, h); }
      ctx.stroke();
      ctx.globalAlpha = 1;

      var lastC = candles[N - 1].c, prevC = candles[N - 2].c;
      var edgeV = prevC + (lastC - prevC) * t;

      if (kind === "candle") {
        var bw = Math.max(2, dx * 0.56);
        for (var j = 0; j < N; j++) {
          var cx = X(j);
          if (cx > w - bw / 2 || cx < -bw) continue;
          var c = candles[j], isUp = c.c >= c.o, cc = isUp ? col.up : col.down;
          ctx.strokeStyle = cc; ctx.fillStyle = cc; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(Math.round(cx) + 0.5, Y(c.h)); ctx.lineTo(Math.round(cx) + 0.5, Y(c.l)); ctx.stroke();
          var top = Y(Math.max(c.o, c.c)), bh = Math.max(1.5, Math.abs(Y(c.o) - Y(c.c)));
          ctx.fillRect(cx - bw / 2, top, bw, bh);
        }
        /* garis harga terakhir */
        var ly = Y(edgeV);
        ctx.setLineDash([4, 4]); ctx.strokeStyle = col.line; ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(w, ly); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;
      } else {
        ctx.beginPath();
        var started = false;
        for (var q = 0; q < N; q++) {
          var px = X(q);
          if (px > w) break;
          if (!started) { ctx.moveTo(px, Y(candles[q].c)); started = true; } else ctx.lineTo(px, Y(candles[q].c));
        }
        ctx.lineTo(w, Y(edgeV));
        /* area */
        var area = new Path2D();
        ctx.save();
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
        var grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, col.line); grad.addColorStop(1, col.bg);
        ctx.globalAlpha = 0.28; ctx.fillStyle = grad; ctx.fill();
        ctx.restore();
        /* garis */
        ctx.beginPath(); started = false;
        for (var r = 0; r < N; r++) {
          var rx = X(r);
          if (rx > w) break;
          if (!started) { ctx.moveTo(rx, Y(candles[r].c)); started = true; } else ctx.lineTo(rx, Y(candles[r].c));
        }
        ctx.lineTo(w, Y(edgeV));
        ctx.lineJoin = "round"; ctx.lineWidth = 2; ctx.strokeStyle = col.line;
        ctx.shadowColor = col.line; ctx.shadowBlur = 12; ctx.stroke(); ctx.shadowBlur = 0;
      }

      /* titik harga live */
      var pulse = 3 + Math.sin(now / 280) * 1.4, dy = Y(edgeV);
      ctx.fillStyle = col.line; ctx.globalAlpha = 0.25;
      ctx.beginPath(); ctx.arc(w - 4, dy, pulse + 4, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(w - 4, dy, 3, 0, 6.2832); ctx.fill();
    }

    function loop(now) {
      if (!canvas.isConnected) return;
      var dt = Math.min(now - last, 200); last = now;
      t += dt / stepMs;
      scroll += (dt / stepMs) * (canvas.clientWidth / (N - 4));
      while (t >= 1) { t -= 1; candles.push(tick()); candles.shift(); head(); }
      if (++frame % 60 === 0) col = palette();
      draw(now);
      requestAnimationFrame(loop);
    }
    if (REDUCED) { t = 1; draw(0); } else requestAnimationFrame(loop);
  }

  function startFx() {
    document.querySelectorAll("canvas.chart").forEach(function (cv) { makeChart(cv, cv.getAttribute("data-kind")); });
    var tk = document.querySelector(".ticker");
    if (tk && !REDUCED) {
      timers.push(setInterval(function () {
        var ems = tk.querySelectorAll("em[data-k]");
        for (var n = 0; n < 4; n++) {
          var key = ORDER[Math.floor(Math.random() * ORDER.length)], v = (Math.random() - 0.45) * 4;
          tk.querySelectorAll('em[data-k="' + key + '"]').forEach(function (em) {
            em.className = v >= 0 ? "up" : "down";
            em.textContent = (v >= 0 ? "▲ " : "▼ ") + Math.abs(v).toFixed(2) + "%";
          });
        }
        void ems;
      }, 1300));
    }
  }
  function stopFx() { timers.forEach(clearInterval); timers = []; }

  /* partikel latar */
  (function () {
    var cv = document.getElementById("bg");
    if (!cv || REDUCED) return;
    var ctx = cv.getContext("2d"), P = [], W = 0, H = 0, f = 0, c = palette().line;
    function spawn() { return { x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.3, vy: -(0.12 + Math.random() * 0.32), r: 1 + Math.random() * 1.6 }; }
    function size() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.min(54, Math.round(W * H / 24000));
      while (P.length < n) P.push(spawn());
      P.length = n;
    }
    size();
    window.addEventListener("resize", size);
    function loop() {
      ctx.clearRect(0, 0, W, H);
      if (++f % 120 === 0) c = palette().line;
      ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = 1;
      for (var i = 0; i < P.length; i++) {
        var p = P[i];
        p.x += p.vx; p.y += p.vy;
        if (p.y < -8) { p.y = H + 8; p.x = Math.random() * W; }
        if (p.x < -8) p.x = W + 8; else if (p.x > W + 8) p.x = -8;
        ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
        for (var j = i + 1; j < P.length; j++) {
          var q = P[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
          if (d2 < 14400) {
            ctx.globalAlpha = (1 - d2 / 14400) * 0.2;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();

  var current = null;
  function render(route) {
    stopFx();
    if (!route || (route !== "home" && route !== "dashboard" && route !== "persiapan" && route !== "apikey" && !BYID[route])) route = "home";
    current = route;
    var html;
    if (route === "home") html = viewHome();
    else if (route === "dashboard") html = viewDashboard();
    else if (route === "persiapan") html = viewPersiapan();
    else if (route === "apikey") html = viewApiKey();
    else html = viewFeature(BYID[route]);
    app.innerHTML = html;
    document.querySelectorAll(".top nav a[data-nav]").forEach(function (a) {
      if (a.getAttribute("data-nav") === route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (route === "dashboard") wireDashboard();
    startFx();
    window.scrollTo(0, 0);
  }
  function go(route) {
    render(route);
    try { history.replaceState(null, "", "#" + route); } catch (e) { /* hash tidak selalu bisa diubah di frame */ }
  }

  function wireDashboard() {
    var q = document.getElementById("q"), cards = document.querySelectorAll("#cards .card"), none = document.getElementById("none");
    var filter = "all";
    function apply() {
      var term = q.value.trim().toLowerCase(), shown = 0;
      cards.forEach(function (c) {
        var ok = (filter === "all" || c.getAttribute("data-g") === filter) && (!term || c.getAttribute("data-hay").indexOf(term) !== -1);
        c.hidden = !ok;
        if (ok) shown++;
      });
      none.hidden = shown !== 0;
    }
    q.addEventListener("input", apply);
    document.querySelectorAll(".filters button").forEach(function (b) {
      b.addEventListener("click", function () {
        filter = b.getAttribute("data-f");
        document.querySelectorAll(".filters button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        apply();
      });
    });
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-route]");
    if (a) { e.preventDefault(); go(a.getAttribute("data-route")); return; }
    var cb = e.target.closest("[data-copy]");
    if (cb) {
      var code = cb.closest(".code").querySelector("code");
      var text = code.textContent;
      var done = function (ok) { cb.textContent = ok ? "Tersalin" : "Teks terpilih"; setTimeout(function () { cb.textContent = "Salin"; }, 1600); };
      var fallback = function () {
        try { var r = document.createRange(); r.selectNodeContents(code); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (err) { /* abaikan */ }
        done(false);
      };
      try { navigator.clipboard.writeText(text).then(function () { done(true); }, fallback); } catch (err) { fallback(); }
    }
  });
  window.addEventListener("hashchange", function () {
    var r = location.hash.replace("#", "");
    if (r !== current) render(r);
  });

  /* tema */
  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    var root = document.documentElement;
    var isLight = root.getAttribute("data-theme") === "light";
    root.setAttribute("data-theme", isLight ? "dark" : "light");
  });

  render(location.hash.replace("#", ""));
})();
</script>
